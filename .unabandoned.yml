schema: 1

package: "@unabandoned/readable-stream"

upstream:
  repo: nodejs/readable-stream
  reason: "upstream release cadence stalled at 4.7.0 while its dependency tree ages; this fork carries it forward"

  # Upstream commits looked at and deliberately not pulled as-is, so the drift
  # report stops re-reporting them and a genuinely new commit stands out.
  reviewed:
    - sha: 0767adb2
      decision: declined
      note: >-
        Node 24/26 support; already fixed here at onboarding (legacy.js counts
        error listeners via this.listeners, the typechecking test accepts both
        error codes); its CI and ajv dev-dep changes target npm 6/7, unsupported here
    - sha: 696a6c1a
      decision: declined
      note: "fixes upstream's repository URL; ours points at this fork"
    - sha: a23ff57e
      decision: declined
      note: >-
        not merged as-is (its test needs tap, which this fork does not carry);
        the library change is ported unchanged, test rewritten on node:test, in #31
    - sha: ffeeda66
      decision: declined
      note: "upstream's v4.8.0 version bump; versions here come from release-please"

summary: >-
  Node.js's streams implemented as a user-land package, so browsers and older
  Node versions get the current stream API.

why-forked: >-
  Forked to keep its dependency tree current — re-scoped onto the @unabandoned
  buffer/events builds — and carried past the last upstream release so Renovate
  can track the tree for consumers.

status: active

used-by:
  - consumer: "@unabandoned/stream-http"
    purpose: "Provides the readable/writable stream implementation the HTTP shim builds on."

tags: [stream, readable, node-core-polyfill, browserify]
